%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/arm,mali-midgard.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ARM Mali Midgard / Bifrost Devices

description: |
  This binding describes ARM Mali Midgard / Bifrost GPU devices.

maintainers:
  - ARM Ltd.

select:
  properties:
    compatible:
      contains:
        enum:
          - arm,malit6xx
          - arm,mali-midgard
          - arm,mali-bifrost
  required:
    - compatible

properties:
  compatible:
    description: |
      Should be mali<chip>, replacing digits with x from the back,
      until malit<Major>xx, and it must end with one of: "arm,malit6xx" or
      "arm,mali-midgard" or "arm,mali-bifrost"

  reg:
    description: |
      The physical base address of the GPU device and the length of the register area.

  interrupts:
    description: |
      An array of three interrupt values used by the GPU.
    $ref: /schemas/types.yaml#/definitions/uint32-matrix

  interrupt-names:
    description: |
      An array with the names of the interrupts in the same order as in "interrupts".
      Must be exactly: "JOB", "MMU", "GPU".
    items:
      - const: JOB
      - const: MMU
      - const: GPU

  clocks:
    description: |
      Optional clock specification array. Each entry is a pair consisting of a phandle
      to a clock and its clock specifier. The order is important: the first clock
      shall correspond to the "clk_mali" source, while the second clock
      (that is optional) shall correspond to the "shadercores" source.

  clock-names:
    description: |
      Optional array of clock names corresponding to the clocks property.
      Typically set to: "clk_mali", "shadercores".

  mali-supply:
    description: |
      Optional phandle to the top-level regulator for the Mali device.

  shadercores-supply:
    description: |
      Optional phandle to the shader cores regulator.

  operating-points-v2:
    description: |
      Optional phandle to the operating points table for the GPU.
      See Documentation/devicetree/bindings/power/arm,mali-opp.yaml for further details.
    $ref: /schemas/types.yaml#/definitions/phandle

  quirks-gpu:
    description: |
      Used to write to the JM_CONFIG or CSF_CONFIG register.
      Should be used with care. Options passed here are used to override
      certain default behavior. Note: This will override 'idvs-group-size'
      field in devicetree and module param 'corestack_driver_control',
      therefore if 'quirks-gpu' is used then 'idvs-group-size' and
      'corestack_driver_control' value should be incorporated into 'quirks-gpu'.
    $ref: /schemas/types.yaml#/definitions/uint32

  quirks-sc:
    description: |
      Used to write to the SHADER_CONFIG register.
      Should be used with care. Options passed here are used to override
      certain default behavior.
    $ref: /schemas/types.yaml#/definitions/uint32

  quirks-tiler:
    description: |
      Used to write to the TILER_CONFIG register.
      Should be used with care. Options passed here are used to
      disable or override certain default behavior.
    $ref: /schemas/types.yaml#/definitions/uint32

  quirks-mmu:
    description: |
      Used to write to the L2_CONFIG register.
      Should be used with care. Options passed here are used to
      disable or override certain default behavior.
    $ref: /schemas/types.yaml#/definitions/uint32

  power-model:
    description: |
      Sets the power model parameters. Defined power models include:
      "mali-simple-power-model", "mali-g51-power-model", "mali-g52-power-model",
      "mali-g52_r1-power-model", "mali-g71-power-model", "mali-g72-power-model",
      "mali-g76-power-model", "mali-g77-power-model", "mali-tnax-power-model",
      "mali-tbex-power-model" and "mali-tbax-power-model".
      - mali-simple-power-model: this model derives the GPU power usage based
        on the GPU voltage scaled by the system temperature. Note: it was
        designed for the Juno platform, and may not be suitable for others.
          - compatible: Should be "arm,mali-simple-power-model"
          - dynamic-coefficient: Coefficient, in pW/(Hz V^2), which is
            multiplied by v^2*f to calculate the dynamic power consumption.
          - static-coefficient: Coefficient, in uW/V^3, which is
            multiplied by v^3 to calculate the static power consumption.
          - ts: An array containing coefficients for the temperature
            scaling factor. This is used to scale the static power by a
            factor of tsf/1000000,
            where tsf = ts[3]*T^3 + ts[2]*T^2 + ts[1]*T + ts[0],
            and T = temperature in degrees.
          - thermal-zone: A string identifying the thermal zone used for
            the GPU
          - temp-poll-interval-ms: the interval at which the system
            temperature is polled
      - mali-g*-power-model(s): unless being stated otherwise, these models derive
        the GPU power usage based on performance counters, so they are more
        accurate.
          - compatible: Should be, as examples, "arm,mali-g51-power-model" /
            "arm,mali-g72-power-model".
          - scale: the dynamic power calculated by the power model is
            multiplied by a factor of 'scale'. This value should be
            chosen to match a particular implementation.
          - min_sample_cycles: Fall back to the simple power model if the
            number of GPU cycles for a given counter dump is less than
            'min_sample_cycles'. The default value of this should suffice.
      * Note: when IPA is used, two separate power models (simple and counter-based)
        are used at different points so care should be taken to configure
        both power models in the device tree (specifically dynamic-coefficient,
        static-coefficient and scale) to best match the platform.
    type: object
    properties:
      compatible:
        oneOf:
          - items:
              - enum:
                  - arm,mali-simple-power-model
                  - arm,mali-g51-power-model
                  - arm,mali-g52-power-model
                  - arm,mali-g52_r1-power-model
                  - arm,mali-g71-power-model
                  - arm,mali-g72-power-model
                  - arm,mali-g76-power-model
                  - arm,mali-g77-power-model
                  - arm,mali-tnax-power-model
                  - arm,mali-tbex-power-model
                  - arm,mali-tbax-power-model
      dynamic-coefficient:
        description: |
          Coefficient (pW/(Hz V^2)) which is multiplied by v^2*f to calculate the
          dynamic power consumption.
        $ref: /schemas/types.yaml#/definitions/uint32-array
      static-coefficient:
        description: |
          Coefficient (uW/V^3) which is multiplied by v^3 to calculate the static
          power consumption.
        $ref: /schemas/types.yaml#/definitions/uint32-array
      ts:
        description: |
          Array of coefficients for the temperature scaling factor.
          This is used to scale the static power by a factor of tsf/1000000,
          where tsf = ts[3]*T^3 + ts[2]*T^2 + ts[1]*T + ts[0],
          and T = temperature in degrees.
        $ref: /schemas/types.yaml#/definitions/uint32-array
      thermal-zone:
        description: The thermal zone identifier for the GPU.
        $ref: /schemas/types.yaml#/definitions/string
      temp-poll-interval-ms:
        description: System temperature polling interval in milliseconds.
      scale:
        description: |
          Scale factor for dynamic power (used in counter-based models).
          This value should be chosed nto match a particular implementation.
        $ref: /schemas/types.yaml#/definitions/uint32
      min_sample_cycles:
        description: |
          Fall back to the simple power model if the
          number of GPU cycles for a given counter dump is less than
          'min_sample_cycles'. The default value of this should suffice.
        $ref: /schemas/types.yaml#/definitions/uint32
    additionalProperties: true

  power-policy:
    description: |
      Optional property that sets the GPU power policy at probe time.
      Options: "coarse_demand" or "always_on" (default: "coarse_demand").
    $ref: /schemas/types.yaml#/definitions/string

  system-coherency:
    description: |
      Optional property that sets the coherency protocol for GPU accesses.
      Valid values: 0 (ACE-Lite), 1 (ACE), or 31 (no coherency).
    $ref: /schemas/types.yaml#/definitions/uint32

  ipa-model:
    description: |
      Sets the IPA model to be used for power management. GPU probe will fail if the
      model is not found in the registered models list. If no model is specified here,
      a gpu-id based model is picked if available, otherwise the default model is used.
      - mali-simple-power-model: Default model used on mali
    $ref: /schemas/types.yaml#/definitions/string

  idvs-group-size:
    description: |
      Optional override for the IDVS group size. Tasks are sent to cores in
      groups of N + 1, so i.e. 0xF means 16 tasks.
      Valid values are from 0 to 0x3F (including).
    $ref: /schemas/types.yaml#/definitions/uint32

  l2-size:
    description: |
      Override L2 cache size on GPU that supports it. Value should be larger than the minimum
      size 1KiB and smaller than the maximum size. Maximum size is Hardware integration dependent.
      The value passed should be of log2(Cache Size in Bytes).
      For example for a 1KiB of cache size, 0xa should be passed.
    $ref: /schemas/types.yaml#/definitions/uint8

  l2-hash:
    description: |
      Optional override for the GPU’s L2 hash function.
    $ref: /schemas/types.yaml#/definitions/uint8

  l2-hash-values:
    description: |
      Optional property to override the L2 hash using provided hash values.
      Mutually exclusive with 'l2-hash'.
    $ref: /schemas/types.yaml#/definitions/uint32-array

  arbiter-if:
    description: |
      Optional phandle to the arbif platform device, used to provide KBASE with an interface
      to the Arbiter. This is required when using arbitration; setting to a non-NULL
      value will enable arbitration.
      If arbitration is in use, then there should be no external GPU control.
      When arbiter-if is in use then the following must not be:
      - power-model                         (no IPA allowed with arbitration)
      - #cooling-cells
      - operating-points-v2                 (no dvfs in kbase with arbitration)
      - system-coherency with a value of 1  (no full coherency with arbitration)
    $ref: /schemas/types.yaml#/definitions/phandle

  int-id-override:
    description: |
      Optional list of <ID Setting[7:0]> tuples defining the IDs to be set in the SYSC_ALLOC register.
    $ref: /schemas/types.yaml#/definitions/uint32-array

  propagate-bits:
    description: |
      Optional bitset used to configure which PBHA bits are propagated on the AXI bus.
      Used to write to L2_CONFIG.PBHA_HWU.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names

additionalProperties: true

examples:
  # Example for a Mali GPU with 1 clock and 1 regulator:
  - |
    gpu@fc010000 {
        compatible = "arm,malit602", "arm,malit60x", "arm,malit6xx", "arm,mali-midgard";
        reg = <0xfc010000 0x4000>;
        interrupts = <0 36 4>, <0 37 4>, <0 38 4>;
        interrupt-names = "JOB", "MMU", "GPU";

        clocks = <&pclk_mali>;
        clock-names = "clk_mali";
        mali-supply = <&vdd_mali>;
        operating-points-v2 = <&gpu_opp_table_example1>;

        idvs-group-size = <0x7>;
        l2-size = /bits/ 8 <0x10>;
        l2-hash = /bits/ 8 <0x04>;  /* or l2-hash-values = <0x12345678 0x8765 0xAB>; */

        power-model@0 {
            compatible = "arm,mali-simple-power-model";
            static-coefficient = <2427750>;
            dynamic-coefficient = <4687>;
            ts = <20000 2000 (-20) 2>;
            thermal-zone = "gpu";
        };
        power-model@1 {
            compatible = "arm,mali-g71-power-model";
            scale = <5>;
        };
    };

    gpu_opp_table_example1: opp-table-0 {
        compatible = "operating-points-v2", "operating-points-v2-mali";

        opp-533000000 {
            opp-hz = /bits/ 64 <533000000>;
            opp-microvolt = <1250000>;
        };
        opp-450000000 {
            opp-hz = /bits/ 64 <450000000>;
            opp-microvolt = <1150000>;
        };
        opp-400000000 {
            opp-hz = /bits/ 64 <400000000>;
            opp-microvolt = <1125000>;
        };
        opp-350000000 {
            opp-hz = /bits/ 64 <350000000>;
            opp-microvolt = <1075000>;
        };
        opp-266000000 {
            opp-hz = /bits/ 64 <266000000>;
            opp-microvolt = <1025000>;
        };
        opp-160000000 {
            opp-hz = /bits/ 64 <160000000>;
            opp-microvolt = <925000>;
        };
        opp-100000000 {
            opp-hz = /bits/ 64 <100000000>;
            opp-microvolt = <912500>;
        };
    };

  # Example for a Mali GPU with 2 clocks and 2 regulators:
  - |
    gpu@6e000000 {
        compatible = "arm,mali-midgard";
        reg = <0x0 0x6e000000 0x0 0x200000>;
        interrupts = <0 168 4>, <0 168 4>, <0 168 4>;
        interrupt-names = "JOB", "MMU", "GPU";

        clocks = <&clk_mali 0>, <&clk_mali 1>;
        clock-names = "clk_mali", "shadercores";
        mali-supply = <&supply0_3v3>;
        shadercores-supply = <&supply1_3v3>;
        system-coherency = <31>;
        operating-points-v2 = <&gpu_opp_table_example2>;
    };

    gpu_opp_table_example2: opp-table-0 {
        compatible = "operating-points-v2", "operating-points-v2-mali";

        opp-0 {
            opp-hz = /bits/ 64 <50000000>;
            opp-hz-real = /bits/ 64 <50000000>, /bits/ 64 <45000000>;
            opp-microvolt = <820000>, <800000>;
            opp-core-mask = /bits/ 64 <0xf>;
        };
        opp-1 {
            opp-hz = /bits/ 64 <40000000>;
            opp-hz-real = /bits/ 64 <40000000>, /bits/ 64 <35000000>;
            opp-microvolt = <720000>, <700000>;
            opp-core-mask = /bits/ 64 <0x7>;
        };
        opp-2 {
            opp-hz = /bits/ 64 <30000000>;
            opp-hz-real = /bits/ 64 <30000000>, /bits/ 64 <25000000>;
            opp-microvolt = <620000>, <700000>;
            opp-core-mask = /bits/ 64 <0x3>;
        };
    };

  # Example for a Mali GPU supporting PBHA configuration via DTB (default):
  - |
    gpu@fc010000 {
        pbha {
            int-id-override = <2 0x32>, <9 0x05>, <16 0x32>;
            propagate-bits = /bits/ 32 <0x03>;
        };
    };
