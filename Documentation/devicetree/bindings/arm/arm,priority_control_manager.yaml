%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/arm,priority_control_manager.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Arm Priority Control Manager

description: |
  This binding describes the Arm priority control manager used by Mali GPU device drivers.
  The node provides an interface to control priority-related functionality for the GPU.
  This node should be referenced by the GPU node via the "priority-control-manager" property.

maintainers:
  - ARM Ltd.

select:
  properties:
    compatible:
      contains:
        enum:
          - arm,priority-control-manager
  required:
    - compatible

properties:
  compatible:
    items:
      - const: arm,priority-control-manager

required:
  - compatible

additionalProperties: false

examples:
  - |
   gpu_priority_control_manager: priority-control-manager {
       compatible = "arm,priority-control-manager";
   };

   gpu: gpu@6e000000 {
       compatible = "arm,mali-midgard";
       reg = <0x0 0x6e000000 0x0 0x200000>;
       interrupts = <0 168 4>, <0 168 4>, <0 168 4>;
       interrupt-names = "JOB", "MMU", "GPU";
       clocks = <&scpi_dvfs 2>;
       clock-names = "clk_mali";
       system-coherency = <31>;
       priority-control-manager = <&gpu_priority_control_manager>;
       operating-points = <50000 820000>;
   };
