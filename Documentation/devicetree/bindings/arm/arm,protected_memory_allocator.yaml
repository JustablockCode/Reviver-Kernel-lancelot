%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/arm,protected_memory_allocator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Arm Protected Memory Allocator

description: |
  This binding describes the Arm protected memory allocator for Mali GPU device drivers.
  The protected memory allocator manages the allocation of physical pages from a reserved
  memory region of protected memory. The node must reference a reserved memory region (via
  the memory-region property) and is itself referenced by the GPU node as the protected-memory-allocator.

maintainers:
  - ARM Ltd.

select:
  properties:
    compatible:
      contains:
        enum:
          - arm,protected-memory-allocator
  required:
    - compatible

properties:
  compatible:
    items:
      - const: arm,protected-memory-allocator

  memory-region:
    description: |
      A phandle that references the reserved memory region node where protected memory is allocated.
    $ref: /schemas/types.yaml#/definitions/phandle

required:
  - compatible
  - memory-region

additionalProperties: false

examples:
  - |
    reserved-memory {
        #address-cells = <1>;
        #size-cells = <1>;
        ranges;

        mali_protected: mali_protected@c0000000 {
            compatible = "mali-reserved";
            reg = <0x0 0xc0000000 0x0 0x1000000>;
        };
    };

    gpu_protected_memory_allocator: protected-memory-allocator {
        compatible = "arm,protected-memory-allocator";
        memory-region = <&mali_protected>;
    };

    gpu_fpga: gpu@6e000000 {
        compatible = "arm,mali-midgard";
        reg = <0x0 0x6e000000 0x0 0x200000>;
        interrupts = <0 168 4>, <0 168 4>, <0 168 4>;
        interrupt-names = "JOB", "MMU", "GPU";
        clocks = <&scpi_dvfs 2>;
        clock-names = "clk_mali";
        protected-memory-allocator = <&gpu_protected_memory_allocator>;
        operating-points = <50000 820000>;
    };
